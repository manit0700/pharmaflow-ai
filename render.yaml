services:
  - type: web
    name: pharmaflow-ai-api
    runtime: node
    rootDir: server
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /api/health
    disk:
      name: pharmaflow-ai-sqlite
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/dev.db
      - key: AUTO_CALL_TEST_MODE
        value: "false"
      - key: ENABLE_SMS_FOLLOWUP
        value: "false"
      - key: PHARMACY_NAME
        value: Premium Family Pharmacy
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: PHARMACY_STAFF_PHONE_NUMBER
        sync: false

  - type: web
    name: pharmaflow-ai-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
